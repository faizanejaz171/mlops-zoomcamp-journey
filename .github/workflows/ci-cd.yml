name: MLOps CI/CD Pipeline (LocalStack)

# 1. Trigger: When should the workflow start?
on:
  pull_request:
    branches:
      - main

jobs:
  terraform-plan:
    name: Terraform Plan & Check
    runs-on: ubuntu-latest

    steps:
      # Task A: Download the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Task B: Start LocalStack using raw Docker
      - name: Start LocalStack
        run: |
          docker run -d -p 4566:4566 -e DEFAULT_REGION=us-east-1 localstack/localstack:2.3.0
          sleep 15

      # Task C: Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Task D: Set Dummy AWS Credentials for LocalStack
      - name: Configure Dummy AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: "test"
          aws-secret-access-key: "test"
          aws-region: us-east-1

      # Task E: Initialize Terraform
      - name: Terraform Init
        run: terraform init -reconfigure
        working-directory: ./infra

      # Task F: Run Terraform Plan to check infra changes
      - name: Terraform Plan
        run: terraform plan
        working-directory: ./infra
